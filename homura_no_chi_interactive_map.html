<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>焔の地｜領域地図</title>
<style>
:root {
  --ink:#f3e5d2; --muted:#c6a991; --gold:#d9a45f; --ember:#ff7138;
  --panel:#211714; --line:#79513c; --shadow:0 18px 60px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{
  color:var(--ink);
  background:
    radial-gradient(ellipse at 50% 0%,rgba(135,48,22,.28),transparent 55%),
    linear-gradient(145deg,#100d0c,#241512 52%,#100d0c);
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  padding:clamp(10px,2.5vw,28px);
}
.page{max-width:1500px;margin:auto}
header{text-align:center;padding:10px 8px 22px}
h1{font-size:clamp(27px,4vw,43px);font-weight:500;letter-spacing:.2em;margin:0;text-shadow:0 0 22px rgba(255,111,48,.35)}
.subtitle{font-size:clamp(11px,1.4vw,14px);letter-spacing:.32em;color:#d5a27d;margin-top:8px}
.lead{text-align:center;color:#c9b19d;line-height:2;font-size:clamp(13px,1.6vw,16px);margin:0 auto 22px;letter-spacing:.04em}
.map-shell{position:relative;overflow:hidden;border:1px solid #8a6045;border-radius:12px;background:#17100e;box-shadow:0 10px 42px rgba(0,0,0,.48),0 0 28px rgba(169,59,25,.12)}
.map-image{display:block;width:100%;height:auto}
.hotspot{
 position:absolute;z-index:2;transform:translate(-50%,-50%);width:clamp(42px,6vw,82px);height:clamp(30px,4vw,54px);
 border:1px solid rgba(255,197,132,.18);border-radius:10px;background:rgba(255,120,54,0);
 cursor:pointer;padding:0;transition:.18s;
}
.hotspot:hover,.hotspot:focus-visible{background:rgba(255,132,64,.16);box-shadow:0 0 0 2px rgba(255,204,145,.7),0 0 24px rgba(255,103,39,.35);outline:none}
/* 地図上の地名ラベルに合わせたクリック範囲 */
.mountain{left:54%;top:19%}
.forest{left:85%;top:25%}
.cave{left:24%;top:42%}
.springs{left:87%;top:45%}
.lake{left:60%;top:57%}
.plain{left:25%;top:73%}
.hint{text-align:center;color:#c39b7e;font-size:13px;margin:14px 4px 0;letter-spacing:.05em}
.places{display:flex;justify-content:center;flex-wrap:wrap;gap:9px 12px;margin:17px auto 0}
.places button{
 border:1px solid #80553e;border-radius:999px;background:linear-gradient(180deg,#38231b,#241713);
 color:#f0d8bf;font:inherit;font-size:13px;padding:9px 16px;cursor:pointer;transition:.18s;
}
.places button:hover,.places button:focus-visible{border-color:#e0a46b;background:linear-gradient(180deg,#57301e,#321b13);outline:none;box-shadow:0 0 16px rgba(255,112,53,.2)}
footer{text-align:center;color:#9b7862;font-size:11px;letter-spacing:.18em;margin:25px 0 5px}
.scrim{position:fixed;inset:0;background:rgba(5,4,4,.78);z-index:10;display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(5px)}
.scrim.open{display:flex}
.dialog{position:relative;width:min(560px,100%);max-height:min(78vh,700px);overflow:auto;background:linear-gradient(145deg,#302019,#1b1210);border:1px solid #986443;border-radius:16px;box-shadow:var(--shadow),0 0 35px rgba(191,70,31,.12);padding:30px clamp(22px,5vw,38px) 28px}
.eyebrow{text-align:center;color:#d18d5d;font-size:10px;letter-spacing:.24em;margin-bottom:10px}
.dialog h2{font-size:clamp(22px,4vw,29px);font-weight:500;text-align:center;margin:0 35px 8px;letter-spacing:.12em}
.dialog .sub{text-align:center;color:#d59a70;font-size:12px;letter-spacing:.08em;margin-bottom:18px}
.rule{width:76px;height:1px;background:linear-gradient(90deg,transparent,#d89a5c,transparent);margin:0 auto 20px}
.description{font-size:15px;line-height:2.05;color:#ead8c6;margin:0;white-space:pre-line}
.close{position:absolute;right:12px;top:12px;width:36px;height:36px;border:1px solid #80553e;border-radius:50%;background:#251713;color:#f2d9c1;font-size:21px;cursor:pointer}
.close:hover{background:#4a281b}
.dialog-foot{text-align:center;font-size:10px;color:#a47d63;margin-top:19px;letter-spacing:.12em}
@media(max-width:640px){
 body{padding:7px} header{padding:6px 5px 15px}
 .map-shell{border-radius:7px} .hint{font-size:11px}
 .places{gap:7px;margin-top:12px} .places button{font-size:11px;padding:8px 12px}
 .scrim{align-items:flex-end;padding:0}
 .dialog{width:100%;max-height:74dvh;border-radius:17px 17px 0 0;padding:26px 23px calc(22px + env(safe-area-inset-bottom))}
 .description{font-size:14px;line-height:1.95}
}
@media(prefers-reduced-motion:no-preference){
 .scrim{animation:fade .16s ease}
 .dialog{animation:rise .2s ease-out}
 @keyframes rise{from{transform:translateY(14px);opacity:.7}to{transform:translateY(0);opacity:1}}
 @keyframes fade{from{opacity:0}to{opacity:1}}
}
</style>
</head>
<body>
<main class="page">
<header>
 <h1>焔の地</h1>
 <div class="subtitle">― ほむらのち ―</div>
</header>

<script>
const places = {"mountain": {"name": "炎冠山", "subtitle": "領域の中心にそびえる火山", "text": "焔の地で最も大きな火山。山頂では絶えず噴煙と炎が立ち上り、山肌には赤熱した溶岩が流れている。アグニスが翼を休めることの多い場所でもある。"}, "forest": {"name": "灰燼森", "subtitle": "火山灰に根付く異形の森", "text": "火山灰に覆われた大地に広がる森。高熱や灰に適応した独特の植物が育ち、炎の環境に適応した生物たちも暮らしている。"}, "cave": {"name": "火脈洞", "subtitle": "地下を巡る炎の道", "text": "地下深くに火脈が張り巡らされた洞窟。地熱と魔力が複雑に交わり、場所によっては強い熱や魔力の乱れが生じる。ティノが巡回に訪れることの多い場所。"}, "springs": {"name": "温熱泉", "subtitle": "地熱が湧き上がる水辺", "text": "地下の熱によって温められた湧水が集まる場所。周囲には湯気が立ちこめ、火山地帯の中では比較的落ち着いて過ごせる一角となっている。"}, "lake": {"name": "焔湖", "subtitle": "大地を照らす広大な溶岩湖", "text": "焔の地の中央部に広がる巨大な溶岩湖。赤く煮えたぎる溶岩が絶えず流動し、周囲の岩場を照らしている。湖岸は高温で、接近には十分な注意が必要。"}, "plain": {"name": "黒曜原", "subtitle": "溶岩が冷えて生まれた黒い平原", "text": "溶岩が冷え固まってできた、黒曜石の岩地が広がる平原。鋭く尖った岩や結晶が点在し、足場の悪い場所も多い。"}};
const scrim = document.getElementById("scrim");
const title = document.getElementById("dialog-title");
const sub = document.getElementById("dialog-sub");
const text = document.getElementById("dialog-text");
const closeButton = document.getElementById("close");
let lastFocus = null;
function openPlace(key) {
 const p = places[key]; if (!p) return;
 lastFocus = document.activeElement;
 title.textContent = p.name; sub.textContent = p.subtitle; text.textContent = p.text;
 scrim.classList.add("open"); document.body.style.overflow = "hidden"; closeButton.focus();
}
function closePlace() {
 scrim.classList.remove("open"); document.body.style.overflow = "";
 if (lastFocus) lastFocus.focus();
}
document.querySelectorAll("[data-place]").forEach(el => el.addEventListener("click", () => openPlace(el.dataset.place)));
closeButton.addEventListener("click", closePlace);
scrim.addEventListener("click", e => { if (e.target === scrim) closePlace(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && scrim.classList.contains("open")) closePlace(); });
</script>
